{{- $root := . -}}
{{- with .Param "post_meta" -}}
    {{- range $field := . -}}
        {{- $p := printf "post_meta/%s.html" $field -}}
        {{- partial $p $root -}}
    {{- end -}}
    <span id="vercount_container_page_pv" style="display:none; margin-left: 10px;">
     本文总阅读量 <span id="vercount_value_page_pv"></span> 次
    </span>
{{- end -}}
