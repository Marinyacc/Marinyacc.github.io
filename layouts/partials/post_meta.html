{{- $root := . -}}
{{- with .Param "post_meta" -}}
    {{- range $field := . -}}
        {{- $p := printf "post_meta/%s.html" $field -}}
        {{- partial $p $root -}}
    {{- end -}}
{{- end -}}

{{/* 核心修改：仅在文章详情页渲染，且放在 meta 栏目内 */}}
{{- if .IsPage -}}
<span id="busuanzi_container_page_pv" style="display:none; margin-left: 10px;">
    <i class="fa fa-eye"></i> 本文总阅读量 <span id="busuanzi_value_page_pv"></span> 次
</span>
{{- end -}}
