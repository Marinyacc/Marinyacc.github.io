{{- $root := . -}}
{{- with .Param "post_meta" -}}
    {{- range $field := . -}}
        {{- $p := printf "post_meta/%s.html" $field -}}
        {{- partial $p $root -}}
    {{- end -}}
{{- end -}}

<span id="busuanzi_container_page_pv" style="display:none;">
    | 本页总阅读量 <span id="busuanzi_value_page_pv"></span> 次
</span>

<span id="busuanzi_container_page_uv" style="display:none;">
    | 本页总访客数 <span id="busuanzi_value_page_uv"></span> 人
</span>
